version: 2

# Supply-chain hygiene (SEC-011). Grouped so a routine patch bump is one reviewable pull
# request rather than fifteen, while the AI stack — which moves fast and breaks API — is
# kept separate so a version jump there gets read properly.

updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: build
      include: scope
    groups:
      agent-framework:
        patterns:
          - Microsoft.Agents.AI*
          - Microsoft.Extensions.AI*
          - GitHub.Copilot.SDK
      azure:
        patterns:
          - Azure.*
      aspire:
        patterns:
          - Aspire.*
      testing:
        patterns:
          - xunit*
          - AwesomeAssertions
          - NSubstitute
          - Microsoft.Testing.*
      runtime:
        patterns:
          - Microsoft.Extensions.*
        exclude-patterns:
          - Microsoft.Extensions.AI*
      telemetry:
        patterns:
          - OpenTelemetry.*

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
    commit-message:
      prefix: ci
